name: Stock Radar Alert System

on:
  schedule:
    # تشغيل تلقائي كل 15 دقيقة خلال أيام التداول
    - cron: '*/15 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بزر التشغيل في أي وقت

jobs:
  run-radar:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy

      - name: Run Radar Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py
